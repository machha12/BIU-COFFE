<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - BUI Coffee</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <style>
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .payment-box { background: white; padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .qr-code { width: 250px; margin: 20px 0; border: 5px solid #003366; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="payment-box">
        <h2 style="color: #003366;">Scan to Pay</h2>
        <p>Please scan the QR Code to complete your order</p>
        
        <img src="img/qr.jpg" alt="QR Code Payment" class="qr-code">
        
        <br>
        <a href="index.html" class="btn btn-secondary mt-3">Back to Menu</a>
    </div>

</body>
</html>
